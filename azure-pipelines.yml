trigger:
- main

pool:
  vmImage: windows-latest

steps:

- task: UseDotNet@2
  inputs:
    packageType: sdk
    version: '9.x'

- task: DotNetCoreCLI@2
  displayName: Restore
  inputs:
    command: restore
    projects: '**/*.sln'

- task: DotNetCoreCLI@2
  displayName: Build
  inputs:
    command: build
    projects: '**/*.sln'
    arguments: '--configuration Release'

- task: DotNetCoreCLI@2
  displayName: Test
  inputs:
    command: test
    projects: '**/*Test.csproj'
    arguments: '--configuration Release'
    publishTestResults: true